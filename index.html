<!doctype html>
<html lang="sr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#151e2e">
    <link rel="icon" href="./favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link rel="manifest" href="./manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="./style.css">
    <!-- Fontovi se učitavaju bez blokiranja prvog prikaza -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap"></noscript>
    <title>AutoDesk | Radionica</title>
</head>
<body>
    <div id="boot" role="status" aria-live="polite">
        <div class="bootInner">
            <img class="bootLogo" src="./slike/logo.png" alt="">
            <strong>Auto Dijagnostika Lazarević</strong>
            <div class="spinner" aria-hidden="true"></div>
            <p id="bootText">Pokretanje aplikacije…</p>
            <p id="bootHint" class="bootHint"></p>
            <button id="bootRetry" class="secondary hidden" type="button">Osveži stranicu</button>
        </div>
    </div>
    <script>
        (function () {
            var hint = document.getElementById('bootHint'), retry = document.getElementById('bootRetry');
            retry.onclick = function () { location.reload(); };
            window.__bootTimers = [
                setTimeout(function () { hint.textContent = 'Učitavanje traje duže nego obično. Proverite internet vezu.'; }, 8000),
                setTimeout(function () { retry.classList.remove('hidden'); }, 15000)
            ];
        })();
    </script>
    <div id="app">
        <aside id="sidebar">
            <div class="brand">
                <img class="brandLogo" src="./slike/logo.png" alt="">
                <div>
                    <strong>Auto Dijagnostika Lazarević</strong>
                    <small>Evidencija </small>
                </div>
            </div>
            <nav id="nav"></nav>
            <div class="sidefoot">
                <span id="serverDot">●</span> <span id="syncText">Sinhronizacija</span>
                <button id="logout">Odjava</button>
            </div>
        </aside>
        
        <div id="menuBackdrop" aria-hidden="true"></div>
        <div id="main">
            <div id="banner" role="status"></div>
            <header>
                <button id="menuBtn" aria-label="Prikaži meni" aria-expanded="false" aria-controls="sidebar">☰</button>
                <div>
                    <small>Radionica</small>
                    <h1 id="pageTitle">Dashboard</h1>
                </div>
                <div class="headerRight">
                    <span id="today"></span>
                    <button class="primary" id="quickOrder">+ Novi nalog</button>
                </div>
            </header>
            <main id="content"></main>
        </div>
    </div>

    <div id="toast" role="alert"></div>
    
    <div id="modal" class="modal hidden">
        <div class="dialog">
            <div class="modalTop">
                <h2 id="modalTitle"></h2>
                <button id="closeModal" class="iconBtn">✕</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="./firebase-config.js"></script>
    <script src="./cloud-sync.js"></script>
    <script src="./local-api.js"></script>
    <script src="./print-docs.js"></script>
    <script src="./private-cache.js"></script>
    <script src="./private-vehicles.js"></script>
    <script src="./fuel.js"></script>
    <script src="./app.js" defer></script>
</body>
</html>
