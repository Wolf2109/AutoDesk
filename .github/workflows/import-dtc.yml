name: Import full DTC database
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/import-dtc.py
      - run: node tests/dtc-smoke.cjs
      - name: Save local database in repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dtc-database.json DTC-UPSTREAM-LICENSE.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Update bundled DTC database'
            git push
          fi
