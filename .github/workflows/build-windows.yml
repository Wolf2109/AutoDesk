name: Build Windows EXE
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'src/**'
      - 'config/**'
      - 'assets/images/**'
      - 'assets/icons/**'
      - 'brands/**'
      - 'data/dtc-database.json'
      - 'data/ecu_database.json'
      - 'data/vehicles-database.json'
      - 'scripts/prepare-www.js'
      - 'desktop/**'
      - 'tests/desktop-smoke.cjs'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-windows
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare desktop resources
        run: node scripts/prepare-www.js --desktop
      - name: Set release version and repository
        working-directory: desktop
        shell: bash
        run: |
          npm version "1.1.${GITHUB_RUN_NUMBER}" --no-git-tag-version --allow-same-version
          node -e 'const fs=require("fs"), p=require("./package.json"); const [owner,repo]=process.env.GITHUB_REPOSITORY.split("/"); p.build.publish=[{provider:"github",owner,repo}]; fs.writeFileSync("package.json",JSON.stringify(p,null,2));'
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Test local server
        run: node --test tests/desktop-smoke.cjs
      - name: Build Windows installer and portable EXE
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: AutoDesk-Windows
          path: |
            desktop/dist/AutoDesk-Setup.exe
            desktop/dist/AutoDesk-Portable.exe
            desktop/dist/AutoDesk-Setup.exe.blockmap
            desktop/dist/latest.yml
          if-no-files-found: error
      - name: Publish Windows update
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.1.${GITHUB_RUN_NUMBER}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$GITHUB_SHA" --title "AutoDesk Windows $tag" --notes "Windows update $tag" --draft
          gh release upload "$tag" desktop/dist/AutoDesk-Setup.exe desktop/dist/AutoDesk-Portable.exe desktop/dist/AutoDesk-Setup.exe.blockmap desktop/dist/latest.yml --clobber
          gh release edit "$tag" --draft=false --latest
          # Remove only older Windows releases, after successful publication. Keep Android and unrelated releases.
          gh release list --limit 1000 --json tagName,isDraft,isPrerelease --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' | while IFS= read -r old; do
            if [[ "$old" =~ ^v1\.1\.([0-9]+)$ ]] && (( 10#${BASH_REMATCH[1]} < GITHUB_RUN_NUMBER )); then
              gh release delete "$old" --yes
            fi
          done
